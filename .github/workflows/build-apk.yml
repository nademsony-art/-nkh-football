
name: Build NKH FOOTBALL APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'nkh_football_flutter_source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          unzip -q nkh_football_flutter_source.zip -d app

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        working-directory: app/nkh_football_flutter_source
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NKH-FOOTBALL-APK
          path: app/nkh_football_flutter_source/build/app/outputs/flutter-apk/app-release.apk
